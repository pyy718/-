<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>域名连通率检测</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: rgba(255, 255, 255, 0.06);
        --card2: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.66);
        --line: rgba(255, 255, 255, 0.12);
        --good: #34d399;
        --bad: #fb7185;
        --warn: #fbbf24;
        --accent: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft YaHei", sans-serif;
        background: radial-gradient(1100px 600px at 20% 0%, rgba(96, 165, 250, 0.18), transparent 60%),
          radial-gradient(900px 600px at 90% 10%, rgba(34, 197, 94, 0.12), transparent 55%),
          radial-gradient(900px 600px at 60% 80%, rgba(251, 113, 133, 0.10), transparent 60%), var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 980px;
        margin: 28px auto 36px;
        padding: 0 16px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 750;
        letter-spacing: 0.2px;
      }

      .sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.35;
      }

      .card {
        background: linear-gradient(180deg, var(--card), rgba(255, 255, 255, 0.03));
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        backdrop-filter: blur(10px);
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 14px;
        margin-top: 12px;
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      label {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input[type="file"],
      input[type="number"] {
        width: 100%;
        padding: 10px 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.25);
        color: var(--text);
        outline: none;
      }

      input[type="number"] {
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }

      .row + .row {
        margin-top: 10px;
      }

      .btns {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
        align-items: center;
      }

      button {
        border: 1px solid rgba(96, 165, 250, 0.55);
        background: rgba(96, 165, 250, 0.14);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 650;
        cursor: pointer;
        transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
      }

      button:hover {
        background: rgba(96, 165, 250, 0.18);
        border-color: rgba(96, 165, 250, 0.75);
      }

      button:active {
        transform: translateY(1px);
      }

      button[disabled] {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .ghost {
        border-color: rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        padding: 8px 10px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 12.5px;
      }

      .pill b {
        color: var(--text);
        font-weight: 750;
      }

      .status {
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
        white-space: pre-wrap;
        line-height: 1.45;
      }

      .out {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.18);
      }

      .out-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .out pre {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.88);
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 10px;
      }

      .k {
        color: rgba(255, 255, 255, 0.82);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 1px 6px;
        border-radius: 999px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>域名连通率检测（Vercel 版）</h1>
          <p class="sub">
            上传 <span class="k">txt</span>（每行 1 个网址/域名或包含网址的文案）→ 开始检测 → 自动生成输出 <span class="k">txt</span>（保持原格式并替换“连通率XX%”）。
          </p>
        </div>
        <div class="pill"><span>默认</span><b>2 次探测</b><span>，≤100 条</span></div>
      </header>

      <div class="card">
        <div class="grid">
          <div>
            <label>上传域名文本（txt）</label>
            <input id="file" type="file" accept=".txt,text/plain" />
            <div class="hint">带 <span class="k">*</span> 的域名会按 <span class="k">a</span> 替换（保持稳定）。</div>

            <div class="btns">
              <button id="run">开始检测</button>
              <button id="download" class="ghost" disabled>下载输出 txt</button>
              <span id="badge" class="pill" style="display: none"></span>
            </div>
            <div id="status" class="status"></div>
          </div>

          <div>
            <div class="row">
              <div>
                <label>探测次数</label>
                <input id="probes" type="number" min="1" max="10" value="2" />
              </div>
              <div>
                <label>并发</label>
                <input id="concurrency" type="number" min="1" max="25" value="8" />
              </div>
              <div>
                <label>超时(ms)</label>
                <input id="timeoutMs" type="number" min="1000" max="60000" value="8000" />
              </div>
            </div>

            <div class="row">
              <div>
                <label>阈值(%)</label>
                <input id="threshold" type="number" min="0" max="100" value="85" />
              </div>
              <div>
                <label>重试次数</label>
                <input id="retries" type="number" min="0" max="5" value="1" />
              </div>
              <div>
                <label>成功判定</label>
                <input id="strict" type="number" min="0" max="1" value="0" />
              </div>
            </div>

            <div class="hint">
              成功判定：<span class="k">0</span>=拿到任何 HTTP 响应就算通（更贴近 itdog 的“访问失败”口径）；<span class="k">1</span>=仅 2xx/3xx 算通。
            </div>
          </div>
        </div>

        <div id="out" class="out" style="display: none">
          <div class="out-head">
            <div class="pill">文件名：<b id="outName">-</b></div>
            <div class="pill">统计：<b id="summary">-</b></div>
          </div>
          <pre id="outText"></pre>
        </div>
      </div>
    </div>

    <script>
      const elFile = document.getElementById("file");
      const elRun = document.getElementById("run");
      const elDownload = document.getElementById("download");
      const elStatus = document.getElementById("status");
      const elOut = document.getElementById("out");
      const elOutName = document.getElementById("outName");
      const elOutText = document.getElementById("outText");
      const elSummary = document.getElementById("summary");
      const elBadge = document.getElementById("badge");

      let lastBlobUrl = null;

      function setBusy(busy) {
        elRun.disabled = busy;
        if (busy) {
          elStatus.textContent = "检测中…（≤100 条通常 1-3 分钟以内，取决于网络）";
        }
      }

      function showBadge(text) {
        elBadge.style.display = "inline-flex";
        elBadge.textContent = text;
      }

      async function readTextFile(file) {
        const buf = await file.arrayBuffer();
        try {
          return new TextDecoder("utf-8", { fatal: false }).decode(buf);
        } catch {
          return new TextDecoder().decode(buf);
        }
      }

      function num(id, def) {
        const v = Number(document.getElementById(id).value);
        return Number.isFinite(v) ? v : def;
      }

      elRun.addEventListener("click", async () => {
        const f = elFile.files && elFile.files[0];
        if (!f) {
          elStatus.textContent = "请先选择 txt 文件。";
          return;
        }

        const probes = Math.max(1, Math.min(10, Math.floor(num("probes", 2))));
        const concurrency = Math.max(1, Math.min(25, Math.floor(num("concurrency", 8))));
        const timeoutMs = Math.max(1000, Math.min(60000, Math.floor(num("timeoutMs", 8000))));
        const threshold = Math.max(0, Math.min(100, Math.floor(num("threshold", 85))));
        const retries = Math.max(0, Math.min(5, Math.floor(num("retries", 1))));
        const strict = num("strict", 0) === 1 ? 1 : 0;

        setBusy(true);
        elDownload.disabled = true;
        elOut.style.display = "none";
        elBadge.style.display = "none";
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = null;

        try {
          const text = await readTextFile(f);
          const res = await fetch("/api/check", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text, probes, concurrency, timeoutMs, threshold, retries, strict }),
          });

          const data = await res.json().catch(() => null);
          if (!res.ok || !data) {
            const msg = (data && data.error) || `请求失败：${res.status}`;
            throw new Error(msg);
          }

          elOutName.textContent = data.fileName || "-";
          elOutText.textContent = data.outputText || "";
          elSummary.textContent =
            `总行数 ${data.stats?.totalLines ?? "-"} / 目标 ${data.stats?.targets ?? "-"} / 失败 ${data.stats?.failedTargets ?? "-"} / 低于阈值 ${data.stats?.lowCount ?? "-"}`;

          elOut.style.display = "block";
          showBadge(`完成：失败目标 ${data.stats?.failedTargets ?? 0} / ${data.stats?.targets ?? 0}`);

          const blob = new Blob([data.outputText || ""], { type: "text/plain;charset=utf-8" });
          lastBlobUrl = URL.createObjectURL(blob);
          elDownload.disabled = false;
          elDownload.onclick = () => {
            const a = document.createElement("a");
            a.href = lastBlobUrl;
            a.download = data.fileName || "域名连通.txt";
            document.body.appendChild(a);
            a.click();
            a.remove();
          };

          elStatus.textContent = "完成。你可以点击“下载输出 txt”。";
        } catch (e) {
          elStatus.textContent = `出错：${e && e.message ? e.message : String(e)}`;
        } finally {
          setBusy(false);
        }
      });
    </script>
  </body>
</html>
